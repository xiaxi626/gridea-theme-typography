<div id="tcomment" data-comment-config="twikoo" data-env-id="{{ commentSetting.envId }}" data-page-id="{{ comment_page_id }}"></div>
<script>
(function() {
    var container = document.getElementById('tcomment');
    var fail = function(message) { container.textContent = message; container.className = 'comment-message'; };
    var envId = container.getAttribute('data-env-id');
    if (!envId) { fail('Twikoo 评论配置不完整。'); return; }
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/twikoo@1.6.44/dist/twikoo.all.min.js';
    script.async = true;
    script.onload = function() {
        try { twikoo.init({ envId: envId, el: '#tcomment', path: container.getAttribute('data-page-id') }); }
        catch (error) { fail('Twikoo 评论初始化失败，请检查配置。'); }
    };
    script.onerror = function() { fail('Twikoo 评论资源加载失败，请稍后重试。'); };
    document.head.appendChild(script);
})();
</script>
