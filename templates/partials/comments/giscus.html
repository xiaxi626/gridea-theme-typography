<div id="giscus-container" data-comment-config="giscus" data-repo="{{ commentSetting.repo }}" data-repo-id="{{ commentSetting.repoId }}" data-category="{{ commentSetting.category }}" data-category-id="{{ commentSetting.categoryId }}" data-page-id="{{ comment_page_id }}" data-theme="{% if theme_config.themeStyle == 'dark' %}/media/styles/giscus-typography-dark.css{% else %}light{% endif %}"></div>
<script>
(function() {
    var container = document.getElementById('giscus-container');
    var theme = container.getAttribute('data-theme');
    if (theme.charAt(0) === '/') { theme = new URL(theme, window.location.origin).href; }
    var fail = function(message) { container.textContent = message; container.className = 'comment-message'; };
    var keys = ['repo', 'repo-id', 'category', 'category-id', 'page-id'];
    if (keys.some(function(key) { return !container.getAttribute('data-' + key); })) { fail('Giscus 评论配置不完整。'); return; }
    var script = document.createElement('script');
    script.src = 'https://giscus.app/client.js';
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.onerror = function() { fail('Giscus 评论资源加载失败，请稍后重试。'); };
    script.setAttribute('data-repo', container.getAttribute('data-repo'));
    script.setAttribute('data-repo-id', container.getAttribute('data-repo-id'));
    script.setAttribute('data-category', container.getAttribute('data-category'));
    script.setAttribute('data-category-id', container.getAttribute('data-category-id'));
    script.setAttribute('data-mapping', 'specific');
    script.setAttribute('data-term', container.getAttribute('data-page-id'));
    script.setAttribute('data-strict', '1');
    script.setAttribute('data-reactions-enabled', '1');
    script.setAttribute('data-emit-metadata', '0');
    script.setAttribute('data-input-position', 'top');
    script.setAttribute('data-theme', theme);
    script.setAttribute('data-lang', 'zh-CN');
    script.setAttribute('data-loading', 'lazy');
    container.appendChild(script);
})();
</script>
